name: Build APK, Release, and Publish F-Droid Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Align and Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > release.jks
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.jks \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out Cadence-Mobile.apk aligned.apk

      - name: Publish Plain APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: Cadence-Mobile.apk

      - name: Build F-Droid Repo and Download Page
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver qrencode
          mkdir -p fdroid/repo
          cp Cadence-Mobile.apk fdroid/repo/
          cd fdroid
          fdroid init --keystore ../release.jks --repo-keyalias "${{ secrets.ALIAS }}" --no-prompt
          sed -i 's|^#* *repo_url:.*|repo_url: "https://borisli713.github.io/Cadence-Mobile/repo"|g' config.yml
          sed -i 's|^#* *repo_name:.*|repo_name: "Cadence Mobile"|g' config.yml
          sed -i 's|^#* *repo_description:.*|repo_description: "Official F-Droid repository for Cadence Mobile"|g' config.yml
          echo 'keystorepass: "${{ secrets.KEY_STORE_PASSWORD }}"' >> config.yml
          echo 'keypass: "${{ secrets.KEY_PASSWORD }}"' >> config.yml
          fdroid update --create-metadata --use-date-from-apk
          FINGERPRINT=$(keytool -list -v -keystore ../release.jks -alias "${{ secrets.ALIAS }}" -storepass "${{ secrets.KEY_STORE_PASSWORD }}" | grep -m 1 "SHA256:" | sed 's/.*SHA256: //;s/://g')
          REPO_URI="https://github.io{FINGERPRINT}"
          qrencode -s 6 -o repo-qr.png "$REPO_URI"
          cat << EOF > index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Cadence Mobile</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 0 20px; text-align: center; }
              .btn { display: inline-block; background: #1976d2; color: #fff; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-weight: bold; margin: 16px 0; }
              .qr { width: 220px; height: 220px; margin: 16px auto; display: block; border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
              code { background: #f4f4f4; padding: 4px 8px; border-radius: 4px; word-break: break-all; display: inline-block; margin-top: 8px; }
            </style>
          </head>
          <body>
            <h1>Cadence Mobile</h1>
            <p>Download the plain APK directly or scan the QR code with F-Droid for automatic updates.</p>
            <a class="btn" href="repo/Cadence-Mobile.apk" download>Download Plain APK</a>
            <h3>Scan to Add F-Droid Repo</h3>
            <img class="qr" src="repo-qr.png" alt="F-Droid Repository QR Code">
            <p><a href="${REPO_URI}">Open directly in F-Droid</a></p>
            <p><code>https://borisli713.github.io/Cadence-Mobile/repo</code></p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'fdroid'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
