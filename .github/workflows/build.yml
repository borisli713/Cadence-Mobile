name: Build, Release & Deploy F-Droid Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout full git history so tags and commits are available
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 2. Detect ./gradlew or install Gradle 9.3.1 (required by AGP 9.1.1)
      - name: Detect Gradle wrapper
        id: gradle_detect
        run: |
          if [ -f "./gradlew" ]; then
            echo "use_wrapper=true" >> "$GITHUB_OUTPUT"
            echo "gradle_version=wrapper" >> "$GITHUB_OUTPUT"
          else
            echo "use_wrapper=false" >> "$GITHUB_OUTPUT"
            echo "gradle_version=9.3.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_detect.outputs.gradle_version }}

      # 3. Compute next version (starts at 1.1.6, then +0.0.1 each build) & patch Gradle config
      - name: Compute & apply next app version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
        run: |
          git fetch --tags --force

          # Inspect the latest released APK's versionCode so Android/F-Droid updates always work
          PREV_VC=0
          LATEST_REL_TAG=$(gh release list --repo "$REPO_FULL" --limit 1 --json tagName -q '.[0].tagName' || true)
          if [ -n "$LATEST_REL_TAG" ]; then
            mkdir -p prev_apk
            gh release download "$LATEST_REL_TAG" --repo "$REPO_FULL" --pattern "*.apk" --dir prev_apk --clobber || true
            PREV_APK=$(find prev_apk -name "*.apk" | head -n 1)
            if [ -n "$PREV_APK" ]; then
              AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
              PREV_VC=$("$AAPT2" dump badging "$PREV_APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
            fi
            rm -rf prev_apk
          fi

          PREV_VC="${PREV_VC:-0}" python3 - <<'EOF'
          import os
          import re
          import subprocess

          prev_vc = int(os.environ.get("PREV_VC") or 0)

          # Find highest existing semver tag (e.g. v1.1.3 -> (1, 1, 3))
          tags_raw = subprocess.check_output(["git", "tag"], text=True).strip()
          versions = []
          for line in tags_raw.splitlines():
              m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", line.strip())
              if m:
                  versions.append(tuple(int(x) for x in m.groups()))

          if not versions or max(versions) < (1, 1, 6):
              next_ver = "1.1.6"
          else:
              major, minor, patch = max(versions)
              next_ver = f"{major}.{minor}.{patch + 1}"

          gradle_path = "app/build.gradle.kts" if os.path.exists("app/build.gradle.kts") else "app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              content = f.read()

          vc_match = re.search(r"\bversionCode\s*=?\s*(\d+)", content)
          gradle_vc = int(vc_match.group(1)) if vc_match else 0
          next_vc = max(prev_vc, gradle_vc) + 1

          content = re.sub(r"(\bversionCode\s*=?\s*)\d+", rf"\g<1>{next_vc}", content, count=1)
          content = re.sub(r'(\bversionName\s*=?\s*)["\'][^"\']*["\']', rf'\g<1>"{next_ver}"', content, count=1)

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"Updated {gradle_path} -> versionName={next_ver}, versionCode={next_vc}")
          EOF

      # 4. Restore google-services.json (works with either raw JSON or base64)
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          TRIMMED=$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//')
          case "$TRIMMED" in
            \{*)
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              ;;
            *)
              echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
              ;;
          esac

      # 5. Build Release APK
      - name: Build Release APK
        run: |
          if [ "${{ steps.gradle_detect.outputs.use_wrapper }}" = "true" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      # 6. Detect installed Android build-tools & sign APK using your exact secrets
      - name: Detect latest Android build-tools
        run: |
          BUILD_TOOLS_VER=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          echo "BUILD_TOOLS_VER=$BUILD_TOOLS_VER" >> "$GITHUB_ENV"

      - name: Sign Release APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VER }}
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # 7. Extract package name, versionCode, and versionName directly from the signed APK
      - name: Read APK metadata & prepare artifact
        id: app_info
        run: |
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          BADGING=$("$AAPT2" dump badging "$SIGNED_APK")

          PACKAGE_NAME=$(echo "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -n 1)
          VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
          VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)

          case "$VERSION_NAME" in
            v*) TAG_NAME="$VERSION_NAME" ;;
            *)  TAG_NAME="v$VERSION_NAME" ;;
          esac

          mkdir -p dist
          APK_NAME="Cadence-Mobile-${TAG_NAME}.apk"
          cp "$SIGNED_APK" "dist/$APK_NAME"

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      # 8. Generate commit-by-commit changelog since the previous release tag
      - name: Generate changelog from commits
        env:
          CURRENT_TAG: ${{ steps.app_info.outputs.tag_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os
          import subprocess

          current_tag = os.environ["CURRENT_TAG"]
          repo_url = os.environ["REPO_URL"]

          # Find the latest tag that is NOT current_tag
          tags_raw = subprocess.check_output(
              ["git", "tag", "--sort=-v:refname"],
              text=True,
          ).strip()
          tags = [t.strip() for t in tags_raw.splitlines() if t.strip()]
          prev_tag = next((t for t in tags if t != current_tag), "")

          log_range = f"{prev_tag}..HEAD" if prev_tag else "HEAD"

          raw = subprocess.check_output(
              ["git", "log", log_range, "--no-merges", "--pretty=format:%s"],
              text=True,
          ).strip()

          commits = [
              line.strip()
              for line in raw.splitlines()
              if line.strip() and not line.strip().lower().startswith(("merge ", "chore(release)"))
          ]

          if not commits:
              raw_all = subprocess.check_output(
                  ["git", "log", log_range, "--pretty=format:%s"],
                  text=True,
              ).strip()
              commits = [line.strip() for line in raw_all.splitlines() if line.strip()]

          if not commits:
              commits = ["Bug fixes and improvements."]

          # A. Markdown release notes for the GitHub Release page
          gh_lines = ["## What's Changed", ""]
          for c in commits:
              gh_lines.append(f"- {c}")

          if prev_tag:
              gh_lines.append("")
              gh_lines.append(f"**Full Changelog**: {repo_url}/compare/{prev_tag}...{current_tag}")

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(gh_lines) + "\n")

          # B. Plain-text changelog for F-Droid (max 500 characters)
          fdroid_text = "\n".join(f"• {c}" for c in commits)
          if len(fdroid_text) > 500:
              fdroid_text = fdroid_text[:497].rstrip() + "..."

          with open("fdroid_notes.txt", "w", encoding="utf-8") as f:
              f.write(fdroid_text + "\n")
          EOF

      # 9. Create GitHub Release with commit changelog
      - name: Create New GitHub Release with Source Code
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_info.outputs.tag_name }}
          name: Release ${{ steps.app_info.outputs.tag_name }}
          body_path: release_notes.md
          files: dist/${{ steps.app_info.outputs.apk_name }}

      # 10. Build F-Droid repo + static GitHub Pages folder
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fdroidserver & QR generator
        run: pip install fdroidserver "qrcode[pil]"

      - name: Build F-Droid repository and Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PACKAGE_NAME: ${{ steps.app_info.outputs.package_name }}
          VERSION_CODE: ${{ steps.app_info.outputs.version_code }}
          LATEST_TAG: ${{ steps.app_info.outputs.tag_name }}
          LATEST_APK: ${{ steps.app_info.outputs.apk_name }}
        run: |
          mkdir -p site/repo "site/metadata/$PACKAGE_NAME/en-US/changelogs"

          # Download all released APKs so "All Released Versions" & F-Droid repo stay complete
          gh release list --repo "$REPO_FULL" --limit 30 --json tagName -q '.[].tagName' | while read -r TAG; do
            gh release download "$TAG" --repo "$REPO_FULL" --pattern "*.apk" --dir site/repo --clobber || true
          done

          # Ensure latest APK and its F-Droid changelog are present
          cp "dist/$LATEST_APK" "site/repo/$LATEST_APK"
          cp fdroid_notes.txt "site/metadata/$PACKAGE_NAME/en-US/changelogs/${VERSION_CODE}.txt"

          # Decode keystore outside site/ so it is never published
          echo "$SIGNING_KEY" | base64 -d > keystore.jks
          chmod 600 keystore.jks

          FINGERPRINT=$(keytool -list -v -keystore keystore.jks -alias "$ALIAS" -storepass "$KEY_STORE_PASSWORD" \
            | sed -n 's/.*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')

          REPO_URL="http://borisli713.github.io/Cadence-Mobile/repo"
          FDROID_URI="fdroidrepos://${REPO_URL}?fingerprint=${FINGERPRINT}"

          cd site
          cat > config.yml <<EOF
          repo_url: "${REPO_URL}"
          repo_name: "Cadence Mobile"
          repo_description: "Official F-Droid repository for Cadence Mobile"
          keystore: "../keystore.jks"
          repo_keyalias: "${ALIAS}"
          keystorepass: "${KEY_STORE_PASSWORD}"
          keypass: "${KEY_PASSWORD}"
          EOF
          chmod 600 config.yml

          fdroid update -c
          rm -f config.yml
          cd ..

          # Generate repo-qr.png and clean index.html (no changelog clutter on HTML page)
          FDROID_URI="$FDROID_URI" REPO_URL="$REPO_URL" LATEST_TAG="$LATEST_TAG" LATEST_APK="$LATEST_APK" python3 - <<'EOF'
          import glob
          import os
          import re
          import qrcode

          fdroid_uri = os.environ["FDROID_URI"]
          repo_url = os.environ["REPO_URL"]
          latest_tag = os.environ["LATEST_TAG"]
          latest_apk = os.environ["LATEST_APK"]

          qr = qrcode.make(fdroid_uri)
          qr.save("site/repo-qr.png")

          apks = [os.path.basename(p) for p in glob.glob("site/repo/*.apk")]

          def ver_key(name):
              return [int(n) for n in re.findall(r"\d+", name)]

          apks.sort(key=ver_key, reverse=True)
          items_html = "\n".join(
              f'        <li><a href="repo/{apk}">{apk}</a></li>' for apk in apks
          )

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Cadence Mobile</title>
            <style>
              body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; background: #0b1120; color: #f1f5f9; line-height: 1.6; }}
              a {{ color: #38bdf8; }}
              .card {{ background: #111a2e; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 24px; margin-bottom: 20px; }}
              .btn {{ display: inline-block; padding: 10px 18px; border-radius: 8px; background: #38bdf8; color: #082f49; font-weight: 600; text-decoration: none; border: none; cursor: pointer; }}
              .btn-sec {{ background: rgba(255,255,255,0.1); color: #f1f5f9; margin-left: 8px; }}
              .center {{ text-align: center; }}
              img.qr {{ width: 180px; height: 180px; background: #fff; padding: 8px; border-radius: 8px; }}
              code {{ background: rgba(0,0,0,0.35); padding: 4px 8px; border-radius: 6px; word-break: break-all; }}
            </style>
          </head>
          <body>
            <p style="text-align:right;"><a href="https://github.com/borisli713/Cadence-Mobile">View on GitHub</a></p>
            <div class="card">
              <h1>Cadence Mobile</h1>
              <p>Latest Version: <strong>{latest_tag}</strong></p>
              <a class="btn" href="repo/{latest_apk}">Download Latest APK ({latest_tag})</a>
            </div>
            <div class="card center">
              <h3>F-Droid Repository</h3>
              <p>Scan the QR code or add the repo in F-Droid for automatic updates</p>
              <img class="qr" src="repo-qr.png" alt="F-Droid Repository QR Code" />
              <p>
                <a class="btn" href="{fdroid_uri}">Open in F-Droid</a>
                <button class="btn btn-sec" onclick="navigator.clipboard.writeText('{repo_url}')">Copy Repo URL</button>
              </p>
              <p><code>{repo_url}</code></p>
            </div>
            <div class="card">
              <h3>All Released Versions</h3>
              <ul>
          {items_html}
              </ul>
            </div>
          </body>
          </html>
          """
          with open("site/index.html", "w", encoding="utf-8") as f:
              f.write(html)
          EOF

      # 11. Deploy to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
