name: Build APK, Release, and Publish F-Droid Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Align and Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > release.jks
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.jks \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out Cadence-Mobile.apk aligned.apk

      - name: Publish Plain APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: Cadence-Mobile.apk

            - name: Build F-Droid Repo and Download Page
        env:
          FDROID_KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver
          mkdir -p fdroid/repo
          cp Cadence-Mobile.apk fdroid/repo/
          cd fdroid
          fdroid init --keystore ../release.jks --repo-keyalias "${{ secrets.ALIAS }}" --no-prompt
          sed -i 's|#repo_url = .*|repo_url = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo"|g' config.yml
          sed -i 's|#repo_name = .*|repo_name = "Cadence Mobile Repo"|g' config.yml
          fdroid update --create-metadata --use-date-from-apk
          printf '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadence Mobile</title><style>body{font-family:sans-serif;max-width:600px;margin:60px auto;padding:0 20px;text-align:center}.btn{display:inline-block;background:#1976d2;color:#fff;padding:14px 28px;text-decoration:none;border-radius:8px;font-weight:bold;margin:20px 0}code{background:#f4f4f4;padding:4px 8px;border-radius:4px;word-break:break-all}</style></head><body><h1>Cadence Mobile</h1><p>Download the plain APK directly or add the F-Droid repository URL below.</p><a class="btn" href="repo/Cadence-Mobile.apk" download>Download APK</a><h3>F-Droid Repository URL</h3><p><code>https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo</code></p></body></html>' > index.html


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'fdroid'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
