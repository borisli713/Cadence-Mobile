name: Release APK & Update F-Droid Repo

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout full git history so tags and commit logs are available
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 2. Restore google-services.json (handles either raw JSON or base64)
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          TRIMMED=$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//')
          case "$TRIMMED" in
            \{*)
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              ;;
            *)
              echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
              ;;
          esac

      # 3. Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 4. Sign APK using your exact repository secrets
      - name: Sign Release APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # 5. Copy & rename signed APK to Cadence-Mobile-vX.Y.Z.apk
      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "dist/Cadence-Mobile-${{ github.ref_name }}.apk"

      # 6. Generate commit-by-commit changelog for GitHub Release & F-Droid
      - name: Generate changelog from commits
        env:
          CURRENT_TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os
          import subprocess

          current_tag = os.environ["CURRENT_TAG"]
          repo_url = os.environ["REPO_URL"]

          # Find the previous tag (e.g., v1.1.2)
          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", f"{current_tag}^"],
                  text=True,
                  stderr=subprocess.DEVNULL,
              ).strip()
              log_range = f"{prev_tag}..{current_tag}"
          except subprocess.CalledProcessError:
              prev_tag = ""
              log_range = current_tag

          # Get commit subjects (skip merges & automated release commits)
          raw = subprocess.check_output(
              ["git", "log", log_range, "--no-merges", "--pretty=format:%s"],
              text=True,
          ).strip()

          commits = [
              line.strip()
              for line in raw.splitlines()
              if line.strip() and not line.strip().lower().startswith(("merge ", "chore(release)"))
          ]

          # Fallback if only merge commits existed
          if not commits:
              raw_all = subprocess.check_output(
                  ["git", "log", log_range, "--pretty=format:%s"],
                  text=True,
              ).strip()
              commits = [line.strip() for line in raw_all.splitlines() if line.strip()]

          if not commits:
              commits = ["Bug fixes and improvements."]

          # A. Markdown release notes for the GitHub Release page
          gh_lines = ["## What's Changed", ""]
          for c in commits:
              gh_lines.append(f"- {c}")

          if prev_tag:
              gh_lines.append("")
              gh_lines.append(f"**Full Changelog**: {repo_url}/compare/{prev_tag}...{current_tag}")

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(gh_lines) + "\n")

          # B. Plain-text changelog for F-Droid (max 500 characters)
          fdroid_text = "\n".join(f"• {c}" for c in commits)
          if len(fdroid_text) > 500:
              fdroid_text = fdroid_text[:497].rstrip() + "..."

          with open("fdroid_notes.txt", "w", encoding="utf-8") as f:
              f.write(fdroid_text + "\n")
          EOF

      # 7. Create GitHub Release with the commit changelog
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          body_path: release_notes.md
          files: dist/Cadence-Mobile-${{ github.ref_name }}.apk

      # 8. Checkout gh-pages branch (contains your F-Droid repo)
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: fdroid-site

      # 9. Add APK and F-Droid changelog (<packageName>/en-US/changelogs/<versionCode>.txt)
      - name: Add APK and changelog to F-Droid repo
        run: |
          APK_PATH="dist/Cadence-Mobile-${{ github.ref_name }}.apk"
          mkdir -p fdroid-site/repo
          cp "$APK_PATH" fdroid-site/repo/

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          BADGING=$("$AAPT2" dump badging "$APK_PATH")

          PACKAGE_NAME=$(echo "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -n 1)
          VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)

          echo "Package: $PACKAGE_NAME | Version Code: $VERSION_CODE"

          mkdir -p "fdroid-site/metadata/$PACKAGE_NAME/en-US/changelogs"
          cp fdroid_notes.txt "fdroid-site/metadata/$PACKAGE_NAME/en-US/changelogs/$VERSION_CODE.txt"

      # 10. Install fdroidserver & rebuild the F-Droid repository index
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Update F-Droid repository
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd fdroid-site

          echo "$SIGNING_KEY" | base64 -d > keystore.jks

          cat > config.yml <<EOF
          repo_url: "http://borisli713.github.io/Cadence-Mobile/repo"
          repo_name: "Cadence Mobile"
          repo_description: "Official F-Droid repository for Cadence Mobile"
          keystore: "keystore.jks"
          repo_keyalias: "$ALIAS"
          keystorepass: "$KEY_STORE_PASSWORD"
          keypass: "$KEY_PASSWORD"
          EOF

          fdroid update -c

          # Remove private keystore & config before deploying to gh-pages
          rm -f keystore.jks config.yml

      # 11. Deploy updated F-Droid repo back to gh-pages
      - name: Deploy updated F-Droid repo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid-site
          keep_files: true