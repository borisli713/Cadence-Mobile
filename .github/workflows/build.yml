name: Build APK and Publish F-Droid Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Align and Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > release.jks
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.jks \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out app-release-signed.apk aligned.apk

      - name: Install fdroidserver and Build Repo
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver
          mkdir -p fdroid/repo
          cp app-release-signed.apk fdroid/repo/Cadence-Mobile.apk
          cd fdroid
          fdroid init --no-prompt
          cat <<EOF > config.yml
          repo_url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo"
          repo_name: "Cadence Mobile Repo"
          repo_description: "Personal F-Droid repository for Cadence Mobile"
          keystore: "../release.jks"
          repo_keyalias: "${{ secrets.ALIAS }}"
          keystorepass: "${{ secrets.KEY_STORE_PASSWORD }}"
          keypass: "${{ secrets.KEY_PASSWORD }}"
          EOF
          fdroid update --create-metadata --use-date-from-apk

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'fdroid'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
